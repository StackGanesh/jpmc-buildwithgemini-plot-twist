<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlotTwist — Books & Movies Concierge</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root { --accent:#7c3aed; --accent-hover:#6d28d9; --bg:#f8fafc; --border:#e2e8f0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); display:flex; flex-direction:column; height:100vh; }
  header { background:linear-gradient(135deg, #6d28d9, #4c1d95); color:#fff; padding:1rem 1.4rem; font-size:1.15rem; font-weight:700; display:flex; align-items:center; gap:0.5rem; box-shadow:0 2px 8px rgba(0,0,0,0.12); }
  #log { flex:1; overflow-y:auto; padding:1.2rem; max-width:780px; width:100%; margin:0 auto; }
  .msg { margin:1rem 0; display:flex; gap:0.65rem; align-items:flex-start; animation:fadeIn 0.25s ease-out; }
  .msg.user { justify-content:flex-end; }
  .avatar { width:36px; height:36px; border-radius:50%; background:#f1f5f9; color:#6d28d9; display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex-shrink:0; box-shadow:0 2px 5px rgba(0,0,0,0.06); border:1px solid var(--border); }
  .msg.user .avatar { background:#7c3aed; color:#fff; border:none; }
  .bubble { display:inline-block; padding:0.75rem 1.1rem; border-radius:16px; background:#fff; border:1px solid var(--border); text-align:left; max-width:82%; white-space:pre-wrap; box-shadow:0 2px 8px rgba(0,0,0,0.04); font-size:0.95rem; line-height:1.5; color:#1e293b; }
  .msg.user .bubble { background:linear-gradient(135deg, #7c3aed, #6d28d9); color:#fff; border:none; box-shadow:0 3px 10px rgba(124,58,237,0.25); border-bottom-right-radius:4px; }
  .msg.agent .bubble { border-bottom-left-radius:4px; }
  /* When the reply is an A2UI card, drop the bubble chrome so the card stands alone. */
  .bubble.rich { background:transparent; border:none; padding:0; max-width:100%; white-space:normal; box-shadow:none; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  form { display:flex; gap:.5rem; padding:1rem; border-top:1px solid var(--border); background:#fff; }
  input { flex:1; padding:.75rem 1rem; border:1px solid var(--border); border-radius:12px; font-size:1rem; outline:none; transition:border-color 0.15s ease; }
  input:focus { border-color:var(--accent); }
  button { padding:.75rem 1.3rem; border:none; border-radius:12px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; transition:background 0.15s ease; }
  button:hover { background:var(--accent-hover); }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card { border:1px solid var(--border); border-radius:12px; padding:1rem; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.06); max-width:100%; }
  .a2card + .a2card, .a2col > .a2card { margin-top:.6rem; }
  .a2col { display:flex; flex-direction:column; gap:.4rem; }
  .a2row { display:flex; flex-direction:row; gap:.6rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.4; }
  .a2text.a2-h1 { font-size:1.5rem; font-weight:700; }
  .a2text.a2-h2 { font-size:1.25rem; font-weight:700; }
  .a2text.a2-h3 { font-size:1.1rem; font-weight:600; }
  .a2text.a2-h4 { font-size:1rem; font-weight:600; }
  .a2text.a2-caption { font-size:.85rem; color:#666; }
  .a2divider { border:none; border-top:1px solid var(--border); margin:.4rem 0; width:100%; }
  .poster-card {
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%) !important;
    border: 1px solid rgba(99, 102, 241, 0.35) !important;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), 0 0 25px rgba(99, 102, 241, 0.2) !important;
    border-radius: 16px !important;
    padding: 1.25rem !important;
    margin-top: 0.8rem !important;
    color: #f8fafc !important;
  }
  .poster-title {
    color: #e0e7ff !important;
    font-size: 1.25rem !important;
    font-weight: 700 !important;
    letter-spacing: 0.5px !important;
    display: flex !important;
    align-items: center !important;
    gap: 0.5rem !important;
    margin-bottom: 0.8rem !important;
    text-shadow: 0 0 12px rgba(99, 102, 241, 0.6) !important;
  }
  .a2img {
    width: 100% !important;
    max-width: 640px !important;
    max-height: 640px !important;
    border-radius: 12px !important;
    display: block !important;
    margin: 0.8rem auto !important;
    object-fit: contain !important;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5) !important;
    transition: transform 0.25s ease !important;
  }
  .a2img:hover { transform: scale(1.02); }
  .poster-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 0.8rem;
    padding: 0.55rem 1.1rem;
    background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
    color: #fff !important;
    font-size: 0.88rem;
    font-weight: 600;
    border-radius: 8px;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    transition: all 0.2s ease;
  }
  .poster-btn:hover {
    background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
  }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:1.25rem; line-height:1; vertical-align:middle; color:var(--accent); }
  
  .examples { display:flex; gap:0.5rem; padding:0.6rem 1rem 0.2rem; max-width:780px; width:100%; margin:0 auto; flex-wrap:wrap; justify-content:center; }
  .example-btn { background:#f1f5f9; border:1px solid var(--border); color:#334155; padding:0.45rem 0.85rem; border-radius:20px; font-size:0.85rem; font-weight:500; cursor:pointer; transition:all 0.15s ease; }
  .example-btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }

  .info-badge { position:relative; cursor:pointer; font-size:0.95rem; margin-left:0.4rem; opacity:0.9; display:inline-flex; align-items:center; }
  .info-badge:hover { opacity:1.0; }
  .tooltip-text { visibility:hidden; width:280px; background-color:#1e293b; color:#fff; text-align:left; border-radius:8px; padding:0.6rem 0.85rem; position:absolute; z-index:100; top:125%; left:50%; transform:translateX(-50%); font-size:0.8rem; font-weight:400; line-height:1.4; box-shadow:0 4px 14px rgba(0,0,0,0.3); opacity:0; transition:opacity 0.2s ease, visibility 0.2s ease; pointer-events:none; }
  .tech-proof-badge { background:#0f172a; border:1px solid #38bdf8; color:#38bdf8; padding:0.5rem 0.8rem; border-radius:8px; font-family:monospace; font-size:0.85rem; margin-top:0.6rem; word-break:break-all; box-shadow:0 2px 8px rgba(56,189,248,0.15); }
</style>
</head>
<body>
<header>
  <span>🎬 PlotTwist — Books & Movies Concierge</span>
  <span class="info-badge" title="PlotTwist helps you discover book & movie recommendations, manage watchlists with visual cards, estimate reading & binge times, and generate custom concept posters!">
    ℹ️
    <span class="tooltip-text">PlotTwist helps you discover book & movie recommendations, manage watch/read lists with visual cards, estimate reading & binge times, and generate custom concept posters!</span>
  </span>
</header>
<div id="log"></div>

<div class="examples">
  <button type="button" class="example-btn" onclick="sendExample('Show me my watchlist')">🎬 Show My Watchlist</button>
  <button type="button" class="example-btn" onclick="sendExample('Recommend 3 sci-fi books for Interstellar fans')">📚 Sci-Fi Recommendations</button>
  <button type="button" class="example-btn" onclick="sendExample('Generate a movie poster concept for Interstellar')">🎨 Generate Concept Poster</button>
</div>

<form id="form">
  <input id="input" placeholder="Ask PlotTwist something…" autocomplete="off" autofocus>
  <button>Send</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function sendExample(promptText) {
  input.value = promptText;
  form.dispatchEvent(new Event("submit"));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "avatar", who === "user" ? "👤" : "🎬");
  const b = el("div", "bubble");
  if (who === "user") {
    m.appendChild(b);
    m.appendChild(avatar);
  } else {
    m.appendChild(avatar);
    m.appendChild(b);
  }
  log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  
  // Extract image URL from text or A2UI
  let imgUrl = null;
  const imgRegexes = [
    /!\[.*?\]\((https?:\/\/[^\s\)]+)\)/i,
    /(https?:\/\/storage\.googleapis\.com\/plottwist-assets-[^\s\)]+)/i,
    /(https?:\/\/[^\s\)]+\/poster_[^\s\)]+\.(?:jpg|jpeg|png))/i,
    /(https?:\/\/[^\s\)]+\.(?:jpg|jpeg|png))/i
  ];
  for (const rx of imgRegexes) {
    const m = textStr.match(rx);
    if (m && m[1]) { imgUrl = m[1]; break; }
    if (m && m[0] && m[0].startsWith("http")) { imgUrl = m[0]; break; }
  }

  // Also check A2UI for any Image component URL
  let a2uiCard1 = null;
  if (a2ui.length > 0) {
    a2uiCard1 = JSON.parse(JSON.stringify(a2ui));
    for (const msg of a2uiCard1) {
      const su = msg.surfaceUpdate;
      if (su && Array.isArray(su.components)) {
        const imageCompIds = new Set();
        for (const c of su.components) {
          if (c && c.component && c.component.Image) {
            imageCompIds.add(c.id);
            if (!imgUrl && c.component.Image.url) {
              imgUrl = boundStr(c.component.Image.url);
            }
          }
        }
        if (imageCompIds.size > 0) {
          // Filter out Image components from Card 1
          su.components = su.components.filter(c => !imageCompIds.has(c.id));
          // Remove Image component IDs from Column/Row children lists
          for (const c of su.components) {
            const spec = c.component && c.component[Object.keys(c.component)[0]];
            if (spec && spec.children && Array.isArray(spec.children.explicitList)) {
              spec.children.explicitList = spec.children.explicitList.filter(id => !imageCompIds.has(id));
            }
          }
        }
      }
    }
  }

  // CARD 1: Render A2UI or Plain Text Details
  b.classList.add("rich");
  let card1Rendered = false;
  if (a2uiCard1) {
    card1Rendered = renderSurface(a2uiCard1, b);
  }

  if (!card1Rendered) {
    const conceptLines = [];
    const lines = textStr.split("\n");
    for (const line of lines) {
      if (!line.trim()) continue;
      if (imgUrl && line.includes(imgUrl)) continue;
      if (line.includes("![") && line.includes("](")) continue;
      if (line.includes("[Tech Proof]")) continue;
      if (line.toLowerCase().includes("concept poster generated successfully")) continue;
      if (line.toLowerCase().includes("public url:")) continue;
      conceptLines.push(line.trim());
    }
    if (conceptLines.length > 0) {
      const textContainer = el("div", "text-body");
      for (const line of conceptLines) {
        textContainer.appendChild(el("div", "line-text", line));
      }
      b.appendChild(textContainer);
      card1Rendered = true;
    }
  }

  // CARD 2: Separate Concept Poster Art Card
  if (imgUrl) {
    const posterBubble = (b.childNodes.length > 0) ? bubble("agent") : b;
    if (posterBubble !== b) posterBubble.textContent = "";

    posterBubble.classList.add("rich", "poster-card");
    posterBubble.appendChild(el("div", "poster-title", "✨ CONCEPT POSTER ART"));

    const img = el("img", "a2img");
    img.src = imgUrl;
    img.alt = "Generated Concept Poster Art";
    posterBubble.appendChild(img);

    const btn = el("a", "poster-btn");
    btn.href = imgUrl;
    btn.target = "_blank";
    btn.innerHTML = "🔗 Open High-Res Poster (Cloud Storage)";
    posterBubble.appendChild(btn);
  }

  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

const userId = 'user-' + Date.now() + '-' + Math.random().toString(36).substring(2, 7);

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text, user_id: userId }) });
    // Read as text first, then parse. If the proxy ever returns a non-JSON error
    // page (e.g. a plain "Internal Server Error"), show that body instead of a
    // cryptic "Unexpected token" JSON error.
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
